<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베트남어 SRS">
<title>베트남어 SRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0d0d1a;overscroll-behavior:none;-webkit-text-size-adjust:none;}
body{font-family:'Noto Sans KR',sans-serif;color:#f0e6ff;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#3d2c7a;border-radius:99px;}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:#0d0d1a;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100dvh;}
.header{padding:14px 20px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #3d2c7a;flex-shrink:0;}
.header-title{font-family:'Boogaloo',cursive;font-size:19px;color:#f7c948;}
.header-sub{font-size:11px;color:#a78bda;margin-top:1px;}
.tabs{display:flex;border-bottom:1px solid #3d2c7a;flex-shrink:0;}
.tab{flex:1;padding:10px 0;background:none;border:none;border-bottom:2px solid transparent;color:#6a4aaa;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.tab.active{border-bottom-color:#f7c948;color:#f7c948;font-weight:700;}
.screen{flex:1;display:flex;flex-direction:column;animation:fadeUp .3s ease;}
.screen.hidden{display:none;}

/* HOME */
.home-body{flex:1;display:flex;flex-direction:column;padding:20px 18px;gap:14px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat-card{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:16px;padding:14px 8px;text-align:center;}
.stat-emoji{font-size:22px;}
.stat-value{font-size:22px;font-weight:700;margin-top:4px;}
.stat-label{font-size:11px;color:#a78bda;margin-top:2px;}
.progress-card{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:16px;padding:14px 16px;}
.progress-header{display:flex;justify-content:space-between;font-size:12px;color:#a78bda;margin-bottom:8px;}
.progress-track{height:8px;background:#0d0d1a;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#a259ff,#f7c948);transition:width .4s;}
.progress-sub{font-size:11px;color:#6a4aaa;margin-top:6px;}
.btn-primary{width:100%;padding:17px;border-radius:18px;border:none;background:linear-gradient(135deg,#a259ff,#f7c948);color:#0d0d1a;font-size:17px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-primary:disabled{background:#1e1440;color:#a78bda;}
.btn-secondary{width:100%;padding:13px;border-radius:14px;border:1.5px solid #3d2c7a;background:transparent;color:#a78bda;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-danger{background:none;border:none;color:#3d2c7a;font-size:12px;cursor:pointer;padding:8px;font-family:'Noto Sans KR',sans-serif;}
.done-banner{background:#0a1a0e;border:1.5px solid #2a6e44;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;animation:popIn .3s ease;}

/* BACKUP */
.backup-area{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.backup-title{font-size:13px;color:#a78bda;font-weight:700;}
.backup-btns{display:flex;gap:8px;}
.backup-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid #3d2c7a;background:#0d0d1a;color:#f0e6ff;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
textarea.backup-input{width:100%;height:80px;background:#0a081a;border:1.5px solid #3d2c7a;border-radius:10px;color:#f0e6ff;font-size:11px;padding:8px;font-family:monospace;resize:none;outline:none;}

/* QUIZ */
.quiz-progress{padding:8px 20px 0;flex-shrink:0;}
.quiz-prog-track{height:4px;background:#1e1440;border-radius:99px;overflow:hidden;}
.quiz-prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#a259ff,#f7c948);transition:width .4s;}
.quiz-prog-text{display:flex;justify-content:space-between;font-size:11px;color:#6a4aaa;margin-top:3px;}
.quiz-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px 8px;gap:14px;}
.badge-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
.badge{font-size:12px;background:#1e1440;border:1px solid #3d2c7a;border-radius:20px;padding:3px 12px;}
.badge-wrong{font-size:12px;color:#f87171;background:#180606;border:1px solid #6e2a2a;border-radius:20px;padding:3px 10px;}
.listen-btn{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#1e1440,#16102e);border:3px solid #3d2c7a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;outline:none;gap:4px;transition:all .2s;}
.listen-btn.pulse{background:radial-gradient(circle,#2a1060,#1e1440);border-color:#a259ff;box-shadow:0 0 28px #a259ff55;transform:scale(1.05);}
.listen-icon{font-size:42px;}
.listen-label{font-size:11px;color:#a78bda;}
.slow-btn{padding:6px 14px;border-radius:20px;border:1px solid #3d2c7a;background:transparent;color:#a78bda;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.feedback{width:100%;padding:14px 16px;border-radius:18px;text-align:center;animation:popIn .22s ease;}
.feedback.correct{border:1.5px solid #2a6e44;background:#06180e;}
.feedback.wrong{border:1.5px solid #6e2a2a;background:#180606;}
.feedback-icon{font-size:26px;}
.feedback-label{font-size:15px;font-weight:700;margin-top:3px;}
.feedback.correct .feedback-label{color:#4ade80;}
.feedback.wrong .feedback-label{color:#f87171;}
.feedback-word{font-size:24px;font-weight:700;color:#f0e6ff;margin-top:6px;font-family:monospace;letter-spacing:1px;}
.feedback-ko{font-size:13px;color:#c4a8e8;margin-top:3px;}
.feedback-next{font-size:11px;color:#4ade8080;margin-top:6px;}
.feedback-mine{font-size:12px;color:#f8717155;margin-top:6px;}
.input-area{flex-shrink:0;padding:10px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #3d2c7a;background:#0d0d1a;display:flex;flex-direction:column;gap:8px;}
.answer-input{width:100%;padding:13px 16px;border-radius:14px;border:2px solid #3d2c7a;background:#0a081a;color:#f0e6ff;font-size:20px;text-align:center;outline:none;font-family:monospace;letter-spacing:1px;}
.answer-input:disabled{opacity:.7;}
.answer-input.correct{border-color:#2a6e44;color:#4ade80;}
.answer-input.wrong-state{border-color:#6e2a2a;color:#f87171;}
.answer-input.shaking{animation:shake .35s ease;}
.confirm-btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#a259ff,#f7c948);color:#0d0d1a;font-size:17px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.confirm-btn.next{background:#1e1440;color:#a78bda;}
.streak-badge{margin-left:auto;background:#1e1440;border:1.5px solid #3d2c7a;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700;color:#f7c948;}

/* WRONG NOTE */
.note-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.note-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6a4aaa;}
.note-item{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.note-count{background:#180606;border:1px solid #6e2a2a;border-radius:10px;padding:4px 10px;font-size:13px;color:#f87171;font-weight:700;flex-shrink:0;}
.note-vi{font-size:17px;font-family:monospace;color:#f0e6ff;letter-spacing:.3px;}
.note-ko{font-size:12px;color:#a78bda;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* STATS */
.stats-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.summary-card{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:14px;padding:14px;text-align:center;}
.chart-card{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:16px;padding:16px 12px;}
.chart-title{font-size:13px;color:#a78bda;margin-bottom:14px;font-weight:700;}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100px;}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.chart-bar-inner{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:90px;gap:1px;}
.chart-label{font-size:8px;color:#6a4aaa;transform:rotate(-30deg);margin-top:2px;white-space:nowrap;}
.chart-label.today{color:#f7c948;font-weight:700;}
.chart-legend{display:flex;gap:12px;margin-top:12px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#a78bda;}
.legend-dot{width:10px;height:10px;border-radius:2px;}
.level-card{background:#1e1440;border:1.5px solid #3d2c7a;border-radius:16px;padding:16px;}
.level-row{margin-bottom:10px;}
.level-header{display:flex;justify-content:space-between;font-size:12px;color:#a78bda;margin-bottom:4px;}
.level-track{height:6px;background:#0d0d1a;border-radius:99px;overflow:hidden;}
.level-fill{height:100%;border-radius:99px;transition:width .6s;}
</style>
</head>

// ── 파싱 ───────────────────────────────────────────────────
const MASTER = [];
RAW.trim().split("\n").forEach(line => {
  const p = line.split("\t");
  if (p.length >= 2) {
    const vi = p[0].trim(), ko = p.slice(1).join(" ").trim();
    if (vi && !MASTER.find(w => w.vi === vi)) MASTER.push({vi, ko});
  }
});
const TOTAL = MASTER.length;
const STORAGE_KEY = "viet-srs-v3";

// ── SM-2 ──────────────────────────────────────────────────
function sm2(card, quality) {
  let {easiness=2.5, interval=0, reps=0} = card;
  if (quality >= 2) {
    if (reps===0) interval=1; else if (reps===1) interval=3; else interval=Math.round(interval*easiness);
    reps++;
  } else { reps=0; interval=1; }
  easiness = Math.max(1.3, easiness + 0.1 - (3-quality)*(0.08+(3-quality)*0.02));
  return {easiness, interval, reps, nextReview: Date.now()+interval*864e5};
}

function norm(s){ return s.toLowerCase().normalize("NFC").replace(/\s+/g," ").trim(); }
function todayKey(){ return new Date().toISOString().slice(0,10); }

function getDue(srs){
  const now = Date.now();
  const due = MASTER.filter(w=>{ const d=srs[w.vi]; return d && d.nextReview<=now; });
  const nw  = MASTER.filter(w=>!srs[w.vi]);
  return [...due, ...nw];
}

// ── TTS ───────────────────────────────────────────────────
function speak(text, rate=0.85){
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="vi-VN"; u.rate=rate;
  const v = window.speechSynthesis.getVoices().find(v=>v.lang.startsWith("vi"));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener("voiceschanged", ()=>window.speechSynthesis.getVoices());

// ── 저장/불러오기 ─────────────────────────────────────────
function saveData(srs, log){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({srs,log})); } catch(e){}
}
function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const p=JSON.parse(raw); return {srs:p.srs||{}, log:p.log||{}}; }
  } catch(e){}
  return {srs:{}, log:{}};
}

// ── 앱 상태 ───────────────────────────────────────────────
let state = {
  srs: {}, log: {},
  phase: "home", // home|playing|correct|wrong|done
  tab: 0,        // 0홈 1오답 2통계
  queue: [], qIdx: 0,
  input: "", streak: 0,
  sessionCorrect: 0, sessionWrong: 0,
  pulsing: false, shaking: false,
  showDoneBanner: false,
};

function setState(patch){ Object.assign(state, patch); render(); }

// ── 렌더 ──────────────────────────────────────────────────
function render(){
  const s = state;
  const wrap = document.getElementById("wrap");
  const isQuiz = s.phase==="playing"||s.phase==="correct"||s.phase==="wrong";
  const isHome = s.phase==="home"||s.phase==="done";

  const totalLearned  = Object.keys(s.srs).length;
  const totalMastered = Object.values(s.srs).filter(d=>d.reps>=3).length;
  const totalDue      = getDue(s.srs).length;

  wrap.innerHTML = `
    <!-- HEADER -->
    <div class="header">
      <span style="font-size:24px">🇻🇳</span>
      <div>
        <div class="header-title">베트남어 SRS</div>
        <div class="header-sub">간격반복 받아쓰기</div>
      </div>
      ${isQuiz ? `<div class="streak-badge">🔥 ${s.streak}</div>` : ""}
    </div>

    ${isHome ? `
    <!-- TABS -->
    <div class="tabs">
      ${["홈","오답노트","통계"].map((t,i)=>`
        <button class="tab ${s.tab===i?"active":""}" onclick="setTab(${i})">${t}</button>
      `).join("")}
    </div>` : ""}

    <!-- SCREENS -->
    ${isHome && s.tab===0 ? renderHome(totalLearned, totalMastered, totalDue) : ""}
    ${isHome && s.tab===1 ? renderWrongNote() : ""}
    ${isHome && s.tab===2 ? renderStats(totalLearned, totalMastered) : ""}
    ${isQuiz ? renderQuiz() : ""}
  `;

  // input 포커스 유지
  if(s.phase==="playing"){
    const inp = document.getElementById("answer-input");
    if(inp){ inp.value=s.input; if(document.activeElement!==inp) inp.focus(); }
  }
}

function renderHome(learned, mastered, due){
  const s = state;
  return `<div class="screen home-body">
    ${s.showDoneBanner ? `
    <div class="done-banner">
      <span style="font-size:28px">🏆</span>
      <div>
        <div style="font-weight:700;color:#4ade80">세션 완료!</div>
        <div style="font-size:13px;color:#a78bda;margin-top:2px">✅ ${s.sessionCorrect}  ❌ ${s.sessionWrong}</div>
      </div>
    </div>` : ""}

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-emoji">📅</div>
        <div class="stat-value" style="color:${due>0?"#f7c948":"#4ade80"}">${due}</div>
        <div class="stat-label">오늘 복습</div>
      </div>
      <div class="stat-card">
        <div class="stat-emoji">📖</div>
        <div class="stat-value" style="color:#a78bda">${learned}</div>
        <div class="stat-label">학습 완료</div>
      </div>
      <div class="stat-card">
        <div class="stat-emoji">⭐</div>
        <div class="stat-value" style="color:#f7c948">${mastered}</div>
        <div class="stat-label">마스터</div>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-header"><span>전체 진도</span><span>${learned} / ${TOTAL}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${(learned/TOTAL)*100}%"></div></div>
      <div class="progress-sub">${TOTAL-learned}개 미학습</div>
    </div>

    <button class="btn-primary" ${due===0?"disabled":""} onclick="startSession()">
      ${due>0 ? `학습 시작 (${due}개) ▶` : "✅ 오늘 학습 완료!"}
    </button>

    <!-- 백업/복원 -->
    <div class="backup-area">
      <div class="backup-title">💾 데이터 백업 / 복원</div>
      <div style="font-size:11px;color:#6a4aaa;margin-bottom:4px">백업 후 메모장에 저장해두세요. 앱 초기화 시 복원할 수 있어요.</div>
      <div class="backup-btns">
        <button class="backup-btn" onclick="exportData()">📤 백업 복사</button>
        <button class="backup-btn" onclick="showImport()">📥 복원하기</button>
      </div>
      <div id="import-area" style="display:none;margin-top:6px">
        <textarea class="backup-input" id="import-text" placeholder="백업 데이터를 붙여넣으세요..."></textarea>
        <button class="backup-btn" style="width:100%;margin-top:6px" onclick="importData()">복원 실행</button>
      </div>
    </div>

    ${learned>0 ? `<button class="btn-danger" onclick="resetData()">데이터 초기화</button>` : ""}
  </div>`;
}

function renderWrongNote(){
  const wrongList = Object.entries(state.srs)
    .filter(([,d])=>d.wrongCount>0)
    .sort((a,b)=>b[1].wrongCount-a[1].wrongCount)
    .map(([vi,d])=>({vi, ko:MASTER.find(w=>w.vi===vi)?.ko||"", wrongCount:d.wrongCount, reps:d.reps}));

  if(wrongList.length===0) return `
    <div class="screen note-body">
      <div class="note-empty">
        <div style="font-size:48px">🎉</div>
        <div style="font-size:15px">오답 기록이 없어요!</div>
      </div>
    </div>`;

  return `<div class="screen note-body">
    <div style="font-size:12px;color:#6a4aaa">총 ${wrongList.length}개 · 많이 틀린 순 · 탭하면 발음 재생</div>
    ${wrongList.map(w=>`
      <div class="note-item" onclick="speak('${w.vi.replace(/'/g,"\\'")}')">
        <div class="note-count">❌ ${w.wrongCount}</div>
        <div style="flex:1;min-width:0">
          <div class="note-vi">${w.vi}</div>
          <div class="note-ko">${w.ko}</div>
        </div>
        <div style="font-size:11px;color:#6a4aaa">${w.reps>=3?"⭐":w.reps>0?`🔄${w.reps}`:"🆕"}</div>
        <span style="font-size:16px;opacity:.5">🔊</span>
      </div>
    `).join("")}
  </div>`;
}

function renderStats(learned, mastered){
  const log = state.log;
  const totalC = Object.values(log).reduce((a,d)=>a+d.correct,0);
  const totalW = Object.values(log).reduce((a,d)=>a+d.wrong,0);
  const totalT = totalC+totalW;
  const days   = Object.values(log).filter(d=>d.correct+d.wrong>0).length;
  const acc    = totalT>0 ? Math.round(totalC/totalT*100)+"%" : "-";

  const last14 = Array.from({length:14},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(13-i));
    const key=d.toISOString().slice(0,10);
    const l=log[key]||{correct:0,wrong:0};
    return {key, label:`${d.getMonth()+1}/${d.getDate()}`, correct:l.correct, wrong:l.wrong, total:l.correct+l.wrong};
  });
  const maxT = Math.max(...last14.map(d=>d.total),1);
  const today = todayKey();

  return `<div class="screen stats-body">
    <div class="summary-grid">
      ${[
        {label:"전체 정답",value:totalC,color:"#4ade80",emoji:"✅"},
        {label:"전체 오답",value:totalW,color:"#f87171",emoji:"❌"},
        {label:"학습일수",value:days,color:"#f7c948",emoji:"📅"},
        {label:"정답률",value:acc,color:"#a259ff",emoji:"🎯"},
      ].map(s=>`
        <div class="summary-card">
          <div style="font-size:20px">${s.emoji}</div>
          <div style="font-size:24px;font-weight:700;color:${s.color};margin-top:4px">${s.value}</div>
          <div style="font-size:11px;color:#a78bda;margin-top:2px">${s.label}</div>
        </div>
      `).join("")}
    </div>

    <div class="chart-card">
      <div class="chart-title">최근 14일 학습량</div>
      <div class="chart-bars">
        ${last14.map(d=>{
          const totalH = (d.total/maxT)*90;
          const correctH = d.total>0?(d.correct/d.total)*totalH:0;
          const wrongH = totalH-correctH;
          const isToday = d.key===today;
          return `<div class="chart-bar-wrap">
            <div class="chart-bar-inner">
              ${d.total>0 ? `
                <div style="width:100%;height:${correctH}px;background:#4ade80;border-radius:3px 3px 0 0;opacity:${isToday?1:.7}"></div>
                ${wrongH>0?`<div style="width:100%;height:${wrongH}px;background:#f87171;opacity:${isToday?1:.7}"></div>`:""}
              ` : `<div style="width:100%;height:4px;background:#2a1a4a;border-radius:3px"></div>`}
            </div>
            <div class="chart-label ${isToday?"today":""}">${d.label}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>정답</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>오답</div>
      </div>
    </div>

    <div class="level-card">
      <div class="chart-title">단어 레벨 분포</div>
      ${[
        {label:"🆕 미학습", count:TOTAL-learned, color:"#3d2c7a"},
        {label:"🔄 학습중", count:learned-mastered, color:"#a259ff"},
        {label:"⭐ 마스터", count:mastered, color:"#f7c948"},
      ].map(s=>`
        <div class="level-row">
          <div class="level-header"><span>${s.label}</span><span>${s.count}개</span></div>
          <div class="level-track"><div class="level-fill" style="width:${(s.count/TOTAL)*100}%;background:${s.color}"></div></div>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function renderQuiz(){
  const s = state;
  const word = s.queue[s.qIdx];
  if(!word) return "";
  const d = s.srs[word.vi] || {};
  const reps = d.reps||0, wrongCount = d.wrongCount||0;
  const badgeLabel = reps===0?"🆕 새 단어":reps<3?`🔄 복습 ${reps}회`:"⭐ 숙련";
  const badgeColor = reps===0?"#a78bda":reps<3?"#f7c948":"#4ade80";
  const pct = (s.qIdx/s.queue.length)*100;

  return `
    <div class="quiz-progress">
      <div class="quiz-prog-track"><div class="quiz-prog-fill" style="width:${pct}%"></div></div>
      <div class="quiz-prog-text">
        <span>✅ ${s.sessionCorrect}  ❌ ${s.sessionWrong}</span>
        <span>${s.qIdx+1} / ${s.queue.length}</span>
      </div>
    </div>

    <div class="quiz-body">
      <div class="badge-row">
        <div class="badge" style="color:${badgeColor}">${badgeLabel}</div>
        ${wrongCount>0?`<div class="badge-wrong">❌ ${wrongCount}회 틀림</div>`:""}
      </div>

      <button class="listen-btn ${s.pulsing?"pulse":""}" onclick="handleSpeak()">
        <div class="listen-icon">🔊</div>
        <div class="listen-label">듣기</div>
      </button>

      <button class="slow-btn" onclick="speak('${word.vi.replace(/'/g,"\\'")}', 0.5)">🐢 천천히 듣기</button>

      ${s.phase!=="playing" ? `
      <div class="feedback ${s.phase}">
        <div class="feedback-icon">${s.phase==="correct"?"✅":"❌"}</div>
        <div class="feedback-label">${s.phase==="correct"?"정답!":"오답"}</div>
        <div class="feedback-word">${word.vi}</div>
        <div class="feedback-ko">${word.ko}</div>
        ${s.phase==="correct"?`<div class="feedback-next">다음 복습: ${s.srs[word.vi]?.interval||1}일 후</div>`:""}
        ${s.phase==="wrong"?`<div class="feedback-mine">내 답: ${s.input}</div>`:""}
      </div>` : ""}
    </div>

    <div class="input-area">
      <input id="answer-input"
        class="answer-input ${s.phase==="correct"?"correct":s.phase==="wrong"?"wrong-state":""} ${s.shaking?"shaking":""}"
        placeholder="철자 입력..."
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
        ${s.phase!=="playing"?"disabled":""}
        oninput="state.input=this.value"
        onkeydown="if(event.key==='Enter')handleSubmit()"
      >
      <button class="confirm-btn ${s.phase!=="playing"?"next":""}" onclick="handleSubmit()">
        ${s.phase==="playing"?"확인하기 →":"다음 단어 ▶"}
      </button>
    </div>
  `;
}

// ── 액션 ──────────────────────────────────────────────────
function setTab(i){ setState({tab:i}); }

function startSession(){
  const due = getDue(state.srs);
  if(due.length===0){ setState({phase:"done", showDoneBanner:true}); return; }
  const shuffled = [...due].sort(()=>Math.random()-.5);
  setState({queue:shuffled, qIdx:0, streak:0, sessionCorrect:0, sessionWrong:0, input:"", phase:"playing", showDoneBanner:false});
  setTimeout(()=>speak(shuffled[0].vi), 300);
}

function handleSpeak(){
  const word = state.queue[state.qIdx];
  if(!word) return;
  setState({pulsing:true});
  speak(word.vi);
  setTimeout(()=>setState({pulsing:false}), 700);
}

function handleSubmit(){
  const s = state;
  if(s.phase==="playing"){
    if(!s.input.trim()){ handleSpeak(); return; }
    const word = s.queue[s.qIdx];
    const ok = norm(s.input)===norm(word.vi);
    const prev = s.srs[word.vi]||{};
    const updated = {
      ...sm2(prev, ok?2:0),
      wrongCount: (prev.wrongCount||0)+(ok?0:1),
      lastSeen: Date.now(),
    };
    const newSrs = {...s.srs, [word.vi]:updated};
    const today = todayKey();
    const tl = s.log[today]||{correct:0,wrong:0};
    const newLog = {...s.log, [today]:{correct:tl.correct+(ok?1:0), wrong:tl.wrong+(ok?0:1)}};
    saveData(newSrs, newLog);

    if(ok){
      setState({srs:newSrs, log:newLog, phase:"correct", streak:s.streak+1, sessionCorrect:s.sessionCorrect+1});
    } else {
      setState({srs:newSrs, log:newLog, phase:"wrong", streak:0, sessionWrong:s.sessionWrong+1, shaking:true});
      setTimeout(()=>setState({shaking:false}), 400);
      setTimeout(()=>speak(word.vi), 300);
    }
  } else {
    const next = s.qIdx+1;
    if(next>=s.queue.length){
      setState({phase:"done", tab:0, showDoneBanner:true});
    } else {
      setState({qIdx:next, phase:"playing", input:""});
      setTimeout(()=>speak(s.queue[next].vi), 150);
      setTimeout(()=>{ const inp=document.getElementById("answer-input"); if(inp)inp.focus(); }, 100);
    }
  }
}

function exportData(){
  const json = JSON.stringify({srs:state.srs, log:state.log});
  navigator.clipboard?.writeText(json).then(()=>alert("📋 클립보드에 복사됐어요!\n메모장에 붙여넣기 해서 저장해두세요.")).catch(()=>{
    prompt("아래 텍스트를 전체 복사하세요:", json);
  });
}

function showImport(){
  const area = document.getElementById("import-area");
  if(area) area.style.display = area.style.display==="none"?"block":"none";
}

function importData(){
  const text = document.getElementById("import-text")?.value?.trim();
  if(!text){ alert("데이터를 입력해주세요."); return; }
  try {
    const p = JSON.parse(text);
    if(!p.srs) throw new Error("형식 오류");
    saveData(p.srs, p.log||{});
    const loaded = loadData();
    setState({srs:loaded.srs, log:loaded.log, phase:"home", showDoneBanner:false});
    alert("✅ 복원 완료! " + Object.keys(p.srs).length + "개 단어 데이터를 불러왔어요.");
  } catch(e){
    alert("❌ 데이터 형식이 잘못됐어요. 다시 확인해주세요.");
  }
}

function resetData(){
  if(confirm("학습 데이터를 초기화할까요?")){
    saveData({},{});
    setState({srs:{}, log:{}, showDoneBanner:false});
  }
}

// ── 초기 로드 ─────────────────────────────────────────────
const loaded = loadData();
state.srs = loaded.srs;
state.log = loaded.log;
render();
</script>
