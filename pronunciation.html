<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🇻🇳 발음">
<title>🇻🇳 베트남어 발음 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0d0d1a;overscroll-behavior:none;-webkit-text-size-adjust:none;}
body{font-family:'Noto Sans KR',sans-serif;color:#f0e6ff;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#3d2c7a;border-radius:99px;}

:root{
  --bg:#0d0d1a;
  --surface:#1e1440;
  --border:#3d2c7a;
  --accent:#f7c948;
  --purple:#a259ff;
  --green:#4ade80;
  --red:#f87171;
  --muted:#a78bda;
  --dim:#6a4aaa;
  --orange:#fb923c;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100dvh;}

/* ── Header ── */
.header{
  padding:12px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.header-flag{font-size:28px;line-height:1;}
.header-title{font-family:'Boogaloo',cursive;font-size:18px;color:var(--accent);}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:1;min-width:60px;padding:9px 4px;
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--dim);font-size:12px;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;white-space:nowrap;transition:color .15s;
}
.tab.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:700;}

/* ── Cards ── */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px;}
.section-title{
  font-family:'Boogaloo',cursive;font-size:20px;color:var(--accent);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}

/* ── 성조 카드 ── */
.tone-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:16px;padding:14px 16px;
  display:flex;flex-direction:column;gap:8px;
  animation:fadeUp .3s ease;
}
.tone-card.active{border-color:var(--accent);background:#1a1200;}
.tone-name{font-size:18px;font-weight:700;color:#f0e6ff;}
.tone-vi{font-family:monospace;font-size:28px;color:var(--accent);font-weight:700;}
.tone-symbol{font-size:13px;color:var(--muted);}
.tone-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.tone-pitch{
  height:48px;border-radius:10px;background:#0d0d1a;
  position:relative;overflow:hidden;border:1px solid var(--border);
}
.tone-pitch svg{width:100%;height:100%;}
.tts-btn{
  padding:7px 14px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:13px;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;align-self:flex-start;
}
.tts-btn:active{background:var(--surface);}

/* ── 최소대립쌍 ── */
.minimal-pair{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.mp-card{
  background:#0d0d1a;border:1.5px solid var(--border);border-radius:12px;
  padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s;
}
.mp-card:active{border-color:var(--accent);background:var(--surface);}
.mp-vi{font-family:monospace;font-size:22px;font-weight:700;color:var(--accent);}
.mp-ko{font-size:11px;color:var(--muted);margin-top:3px;}
.mp-tone{font-size:10px;color:var(--dim);margin-top:2px;}

/* ── 성조 표기법 ── */
.rule-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;padding:13px 15px;margin-bottom:8px;
}
.rule-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.rule-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:6px;}
.rule-examples{display:flex;flex-wrap:wrap;gap:6px;}
.rule-ex{
  font-family:monospace;font-size:14px;color:#f0e6ff;
  background:#0d0d1a;border:1px solid var(--border);
  border-radius:8px;padding:3px 10px;cursor:pointer;
}
.rule-ex:active{border-color:var(--accent);}

/* ── 연습 그리드 ── */
.practice-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
}
.practice-cell{
  background:#0d0d1a;border:1.5px solid var(--border);
  border-radius:10px;padding:8px 4px;text-align:center;
  cursor:pointer;transition:all .15s;
}
.practice-cell:active{border-color:var(--accent);background:var(--surface);}
.practice-vi{font-family:monospace;font-size:17px;font-weight:700;color:var(--accent);}

/* ── 남부/북부 배지 ── */
.region-badge{
  display:inline-flex;gap:6px;margin-top:6px;
}
.badge-north{font-size:11px;background:#0a1a2a;border:1px solid #2a5e8a;border-radius:20px;padding:2px 8px;color:#60a5fa;}
.badge-south{font-size:11px;background:#1a0a0a;border:1px solid #8a2a2a;border-radius:20px;padding:2px 8px;color:#f87171;}

/* ── 정리 카드 ── */
.summary-sentence{
  font-family:monospace;font-size:22px;font-weight:700;
  color:var(--accent);text-align:center;
  background:#0d0d1a;border:1.5px solid var(--border);
  border-radius:14px;padding:16px;margin-bottom:8px;
  cursor:pointer;
}
.summary-sentence:active{border-color:var(--accent);}
.tone-arrows{display:flex;justify-content:center;gap:12px;margin-bottom:4px;}
.arrow{font-size:20px;}

/* ── 진도 바 ── */
.prog-track{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--accent));transition:width .4s;}
</style>
</head>
<body>
<div id="app"><div class="wrap" id="root"></div></div>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   1. 강의 데이터
═══════════════════════════════════════════════════════════════ */
const CHAPTERS = [
  // 1강
  { id: 0, title: '6성조',    emoji: '🎵', lecture: 1 },
  { id: 1, title: '높낮이',   emoji: '📊', lecture: 1 },
  { id: 2, title: '남부발음', emoji: '🗺️', lecture: 1 },
  { id: 3, title: '표기법',   emoji: '✍️', lecture: 1 },
  { id: 4, title: '1강정리',  emoji: '✅', lecture: 1 },
  // 2강
  { id: 5, title: '문자표',   emoji: '🔤', lecture: 2 },
  { id: 6, title: 'A/Ă/Â',   emoji: '🅰️', lecture: 2 },
  { id: 7, title: 'E/Ê/I/Y', emoji: '📝', lecture: 2 },
  { id: 8, title: 'e vs ê',  emoji: '👄', lecture: 2 },
  { id: 9, title: '2강정리',  emoji: '✅', lecture: 2 },
];

const TONES = [
  {
    name: 'Dấu ngang (평성)',
    symbol: '없음',
    example: 'MA',
    desc: '기본음. \'솔~\' 음으로 일정하게 내뱉기. 성조 표시 없음.',
    pitch: 'flat',
    color: '#60a5fa',
    meaning: 'ma (귀신)',
    north: 'ma', south: 'ma',
  },
  {
    name: 'Dấu sắc (올림성조)',
    symbol: '́  (sắc)',
    example: 'MÁ',
    desc: '낮은 곳에서 높게 올라가는 성조.',
    pitch: 'rising',
    color: '#4ade80',
    meaning: 'má (엄마/뺨)',
    north: 'má', south: 'má',
  },
  {
    name: 'Dấu huyền (내림성조)',
    symbol: '`  (huyền)',
    example: 'MÀ',
    desc: '높은 곳에서 낮게 내려가는 성조.',
    pitch: 'falling',
    color: '#f87171',
    meaning: 'mà (하지만)',
    north: 'mà', south: 'mà',
  },
  {
    name: 'Dấu hỏi (물음성조)',
    symbol: '?  (hỏi)',
    example: 'MẢ',
    desc: '내려갔다가 올라오는 성조. 물음표 느낌.',
    pitch: 'dip',
    color: '#fb923c',
    meaning: 'mả (묘지)',
    north: 'mả', south: 'mả',
  },
  {
    name: 'Dấu ngã (꺾임성조)',
    symbol: '~  (ngã)',
    example: 'MÃ',
    desc: '올라가다가 꺾이는 성조. ⚠️ 남부에서는 hỏi와 동일하게 발음!',
    pitch: 'broken',
    color: '#a259ff',
    meaning: 'mã (말/코드)',
    north: 'mã', south: 'mả (hỏi와 동일)',
  },
  {
    name: 'Dấu nặng (무거운성조)',
    symbol: '.  (nặng)',
    example: 'MẠ',
    desc: '낮고 짧게 뚝 떨어지는 성조. 가장 낮은 음.',
    pitch: 'heavy',
    color: '#f7c948',
    meaning: 'mạ (모/벼)',
    north: 'mạ', south: 'mạ',
  },
];

const MINIMAL_PAIRS = [
  { vi: 'ma',  ko: '귀신',    tone: 'ngang' },
  { vi: 'má',  ko: '엄마/뺨', tone: 'sắc'  },
  { vi: 'mà',  ko: '하지만',  tone: 'huyền'},
  { vi: 'mả',  ko: '묘지',    tone: 'hỏi'  },
  { vi: 'mã',  ko: '말/코드', tone: 'ngã'  },
  { vi: 'mạ',  ko: '모/벼',   tone: 'nặng' },
];

const RULES = [
  {
    title: '★ 기본: 성조는 모음 위/아래에 표기',
    desc: '성조 부호는 항상 모음에 붙어요.',
    examples: ['Tớ', 'Là', 'Họ'],
  },
  {
    title: '★ 모음이 두 개인 경우: 앞 모음에 표기',
    desc: '단, oa, oe, uê, uơ, uy로 끝나는 경우 뒤 모음에 표기!',
    examples: ['Nói', 'Đợi', 'Kẹo', 'Toà', 'Khoẻ'],
  },
  {
    title: '★ 모음이 세 개인 경우: 가운데 모음에 표기',
    desc: '',
    examples: ['Hội thoại', 'Thoải mái', 'Xoài'],
  },
  {
    title: '★ 끝자음(받침)이 있는 경우: 받침 앞 모음에 표기',
    desc: '',
    examples: ['Tiếng', 'Trường', 'Khoảng', 'Chuyện', 'Quyền'],
  },
];

const PRACTICE_SETS = [
  ['HA','HÁ','HÀ','HẢ','HÃ','HẠ'],
  ['CA','CÁ','CÀ','CẢ','CÃ','CẠ'],
  ['TA','TÁ','TÀ','TẢ','TÃ','TẠ'],
  ['LA','LÁ','LÀ','LẢ','LÃ','LẠ'],
];

const SOUTH_NOTE = [
  { pair: ['mả (hỏi)', 'mã (ngã)'], desc: '남부에서는 Dấu ngã = Dấu hỏi로 발음' },
  { pair: ['ma mã → xin lỗi [씬 로이]'], desc: '북부 발음' },
  { pair: ['mạ mã → mạnh mẽ [마잉 매/만 매]'], desc: '남부 발음' },
  { pair: ['má mạ → bố mẹ [보 매]'], desc: '' },
];

/* ═══════════════════════════════════════════════════════════════
   2. APP STATE
═══════════════════════════════════════════════════════════════ */
const App = {
  tab: 0,
};

/* ═══════════════════════════════════════════════════════════════
   3. TTS
═══════════════════════════════════════════════════════════════ */
const TTS = {
  init() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener('voiceschanged', () => window.speechSynthesis.getVoices());
  },
  speak(text, rate = 0.8) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; u.rate = rate;
    const v = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('vi'));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  },
};

/* ═══════════════════════════════════════════════════════════════
   4. PITCH SVG 생성
═══════════════════════════════════════════════════════════════ */
function pitchSVG(type, color) {
  const paths = {
    flat:    'M 10 24 L 90 24',
    rising:  'M 10 36 L 90 8',
    falling: 'M 10 8  L 90 36',
    dip:     'M 10 16 Q 50 44 90 12',
    broken:  'M 10 32 Q 30 10 50 16 L 54 22 L 90 8',
    heavy:   'M 10 12 L 90 38',
  };
  return `<svg viewBox="0 0 100 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="8"  x2="100" y2="8"  stroke="#2a1a4a" stroke-width="0.5"/>
    <line x1="0" y1="22" x2="100" y2="22" stroke="#2a1a4a" stroke-width="0.5"/>
    <line x1="0" y1="36" x2="100" y2="36" stroke="#2a1a4a" stroke-width="0.5"/>
    <path d="${paths[type]}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="${getEndY(type)}" r="3" fill="${color}"/>
  </svg>`;
}

function getEndY(type) {
  return { flat:24, rising:8, falling:36, dip:12, broken:8, heavy:38 }[type];
}

/* ═══════════════════════════════════════════════════════════════
   5. RENDERER
═══════════════════════════════════════════════════════════════ */
function render() {
  const root = document.getElementById('root');
  root.innerHTML = renderHeader() + renderTabs() + renderScreen();
}

function renderHeader() {
  return `<div class="header">
    <span class="header-flag">🇻🇳</span>
    <span class="header-title">발음 가이드</span>
    <span></span>
  </div>`;
}

function renderTabs() {
  const lec1 = CHAPTERS.filter(c => c.lecture === 1);
  const lec2 = CHAPTERS.filter(c => c.lecture === 2);
  return `
    <div style="padding:6px 12px 2px;font-size:10px;color:var(--dim);font-weight:700;flex-shrink:0;">1강 · 성조</div>
    <div class="tabs" style="margin-bottom:0;">${lec1.map(c =>
      `<button class="tab${App.tab === c.id ? ' on' : ''}" onclick="App.tab=${c.id};render()">
        ${c.emoji} ${c.title}
      </button>`
    ).join('')}</div>
    <div style="padding:6px 12px 2px;font-size:10px;color:var(--dim);font-weight:700;flex-shrink:0;">2강 · 모음</div>
    <div class="tabs">${lec2.map(c =>
      `<button class="tab${App.tab === c.id ? ' on' : ''}" onclick="App.tab=${c.id};render()">
        ${c.emoji} ${c.title}
      </button>`
    ).join('')}</div>`;
}

function renderScreen() {
  switch (App.tab) {
    case 0: return renderToneBasics();
    case 1: return renderTonePitch();
    case 2: return renderSouthPronun();
    case 3: return renderNotation();
    case 4: return renderPractice();
    case 5: return render2CharTable();
    case 6: return render2VowelA();
    case 7: return render2VowelEI();
    case 8: return render2EVsE();
    case 9: return render2Summary();
  }
}

/* ─── Chapter 0: 6성조 기초 ──────────────────────────────── */
function renderToneBasics() {
  return `<div style="flex:1;overflow-y:auto;padding:16px 16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease;">
    <div class="card">
      <div class="section-title">🎵 베트남어 6성조</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:8px;">
        • 성조 = Dấu (저우) 또는 Thanh điệu (타잉 디에우)<br>
        • 총 6개. <span style="color:var(--accent);font-weight:700">성조가 없는 것도 성조에 포함!</span><br>
        • 기본음: <span style="color:var(--accent)">'솔~'</span> 음으로 일정하게 내뱉기
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:100%"></div></div>
    </div>

    ${TONES.map((t, i) => `
    <div class="tone-card" id="tone-${i}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="tone-name" style="color:${t.color}">${t.name}</div>
          <div class="tone-symbol">부호: ${t.symbol}</div>
        </div>
        <div style="font-family:'Boogaloo',cursive;font-size:36px;color:${t.color}">${t.example}</div>
      </div>
      <div class="tone-pitch">${pitchSVG(t.pitch, t.color)}</div>
      <div class="tone-desc">${t.desc}</div>
      <div style="font-size:12px;color:var(--muted);">예시: <span style="font-family:monospace;color:${t.color}">${t.meaning}</span></div>
      <button class="tts-btn" onclick="TTS.speak('${t.north}')">🔊 듣기</button>
    </div>`).join('')}
  </div>`;
}

/* ─── Chapter 1: 성조 높낮이 비교 ───────────────────────── */
function renderTonePitch() {
  const order = [
    { name:'Dấu sắc',  color:'#4ade80', pos:0 },
    { name:'Dấu ngã',  color:'#a259ff', pos:1 },
    { name:'Dấu ngang',color:'#60a5fa', pos:2 },
    { name:'Dấu hỏi',  color:'#fb923c', pos:3 },
    { name:'Dấu huyền',color:'#f87171', pos:4 },
    { name:'Dấu nặng', color:'#f7c948', pos:5 },
  ];

  return `<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease;">
    <div class="card">
      <div class="section-title">📊 성조 높낮이 순서</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">위에서 아래로 → 높은 음에서 낮은 음 순서</div>
      <div style="display:flex;gap:10px;">
        <div style="display:flex;flex-direction:column;justify-content:space-between;height:200px;padding:4px 0;">
          ${order.map(t => `<div style="font-size:12px;font-weight:700;color:${t.color}">${t.name}</div>`).join('')}
        </div>
        <div style="flex:1;position:relative;height:200px;background:#0d0d1a;border-radius:10px;border:1px solid var(--border);">
          <div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;">
            ${order.map(t => `<div style="height:2px;background:${t.color};opacity:0.3;margin:0 8px;border-radius:99px;"></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">🎯 성조별 음정 그래프</div>
      ${TONES.map(t => `
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:13px;font-weight:700;color:${t.color}">${t.name}</span>
          <button class="tts-btn" onclick="TTS.speak('${t.north}')" style="padding:4px 10px;font-size:12px;">🔊</button>
        </div>
        <div class="tone-pitch">${pitchSVG(t.pitch, t.color)}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ─── Chapter 2: 남부 발음 차이 ──────────────────────────── */
function renderSouthPronun() {
  return `<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease;">

/* ═══════════════════════════════════════════════════════════════
   6. ACTIONS
═══════════════════════════════════════════════════════════════ */
function playAll() {
  let i = 0;
  const pairs = MINIMAL_PAIRS;
  function next() {
    if (i >= pairs.length) return;
    TTS.speak(pairs[i].vi);
    i++;
    setTimeout(next, 1200);
  }
  next();
}

function playAllSentences() {
  const sentences = ['Bạn ơi','Ăn cơm','Bận việc','Nhớ em','Thế à','Xin lỗi','Đọc kỹ','Đi ăn'];
  let i = 0;
  function next() {
    if (i >= sentences.length) return;
    TTS.speak(sentences[i]);
    i++;
    setTimeout(next, 1500);
  }
  next();
}

    <div class="card">

        { vi:'Chị thích màu đen.', ko:'언니는 검은색을 좋아해요.', pron:'찌 틱 마우 댄/찌 틸 마우 댄' },
        { vi:'Anh đến để ăn.',     ko:'형은 먹으러 왔어요.',       pron:'아잉 덴 데 안/안 덴 데 앙' },

}
