<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🇻🇳 발음">
<title>🇻🇳 베트남어 발음 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0d0d1a;overscroll-behavior:none;-webkit-text-size-adjust:none;}
body{font-family:'Noto Sans KR',sans-serif;color:#f0e6ff;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#3d2c7a;border-radius:99px;}
:root{
  --bg:#0d0d1a;--surface:#1e1440;--border:#3d2c7a;
  --accent:#f7c948;--purple:#a259ff;--green:#4ade80;
  --red:#f87171;--muted:#a78bda;--dim:#6a4aaa;--orange:#fb923c;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100dvh;}
.header{padding:12px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.header-flag{font-size:26px;line-height:1;}
.header-title{font-family:'Boogaloo',cursive;font-size:18px;color:var(--accent);}
.back-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;align-items:center;gap:4px;}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:58px;padding:9px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-size:11px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;transition:color .15s;}
.tab.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:700;}
.screen-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px;}
.section-title{font-family:'Boogaloo',cursive;font-size:20px;color:var(--accent);margin-bottom:10px;}
.info-text{font-size:12px;color:var(--muted);line-height:1.8;}
.pitch-box{height:48px;border-radius:10px;background:#0d0d1a;border:1px solid var(--border);overflow:hidden;margin-top:8px;}
.pitch-box svg{width:100%;height:100%;}
.tts-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:8px;}
.list-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
.btn-full{width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.home-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .3s ease;}
.lecture-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s,background .15s;animation:popIn .3s ease both;}
.lecture-card:active{border-color:var(--accent);background:#1a1200;}
.lecture-emoji{font-size:28px;flex-shrink:0;}
.lecture-info{flex:1;margin-left:14px;}
.lecture-num{font-size:11px;color:var(--dim);font-weight:700;}
.lecture-title{font-size:17px;font-weight:700;color:#f0e6ff;margin-top:1px;}
.lecture-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.lecture-arrow{font-size:20px;color:var(--dim);flex-shrink:0;}
</style>
</head>
<body>
<div id="app"><div class="wrap" id="root"></div></div>
<script>
'use strict';

/* 1. LECTURE REGISTRY */
const LECTURES = {};

/* 2. APP STATE */
const App = { screen:'home', lectureId:null, chapterIdx:0 };

/* 3. TTS */
const TTS = {
  init() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener('voiceschanged', () => window.speechSynthesis.getVoices());
  },
  speak(text, rate=0.8) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='vi-VN'; u.rate=rate;
    const v = window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('vi'));
    if (v) u.voice=v;
    window.speechSynthesis.speak(u);
  },
};

/* 4. HELPERS */
function pitchSVG(type, color) {
  const paths = {flat:'M 10 24 L 90 24',rising:'M 10 36 L 90 8',falling:'M 10 8 L 90 36',dip:'M 10 16 Q 50 44 90 12',broken:'M 10 32 Q 30 10 50 16 L 54 22 L 90 8',heavy:'M 10 12 L 90 38'};
  const endY  = {flat:24,rising:8,falling:36,dip:12,broken:8,heavy:38};
  return `<svg viewBox="0 0 100 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="8"  x2="100" y2="8"  stroke="#2a1a4a" stroke-width="0.5"/>
    <line x1="0" y1="22" x2="100" y2="22" stroke="#2a1a4a" stroke-width="0.5"/>
    <line x1="0" y1="36" x2="100" y2="36" stroke="#2a1a4a" stroke-width="0.5"/>
    <path d="${paths[type]}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="${endY[type]}" r="3" fill="${color}"/>
  </svg>`;
}

function renderVowelCards(vowels) {
  return `<div class="screen-scroll">
    ${vowels.map(v=>`
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <div style="width:56px;height:56px;border:2px solid var(--accent);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;flex-shrink:0;">
          <span style="font-size:24px;font-weight:700;color:var(--accent);">${v.char}</span>
          <span style="font-size:8px;color:var(--dim);text-align:center;padding:0 2px;">${v.label}</span>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#f0e6ff;">[${v.sound}]</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${v.desc}</div>
        </div>
      </div>
      ${v.examples.map(e=>`
      <div onclick="TTS.speak('${e.vi}')" class="list-item" style="cursor:pointer;">
        <div>
          <span style="font-family:monospace;font-size:18px;font-weight:700;color:var(--accent);">${e.vi}</span>
          <span style="font-size:12px;color:var(--muted);margin-left:8px;">${e.ko}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:var(--dim);">[${e.pron}]</span>
          <span style="opacity:.5">🔊</span>
        </div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}

/* 5. RENDERER */
function render() {
  const root = document.getElementById('root');
  root.innerHTML = renderHeader() + renderBody();
}

function renderHeader() {
  if (App.screen === 'home') {
    return `<div class="header">
      <span class="header-flag">🇻🇳</span>
      <span class="header-title">발음 가이드</span>
      <span></span>
    </div>`;
  }
  const lec = LECTURES[App.lectureId];
  return `<div class="header">
    <button class="back-btn" onclick="goHome()">← 목록</button>
    <span style="font-size:14px;font-weight:700;color:var(--accent);">${lec.emoji} ${lec.id}강 · ${lec.title}</span>
    <span></span>
  </div>`;
}

function renderBody() {
  if (App.screen === 'home') return renderHome();
  return renderLecture();
}

function renderHome() {
  const ids = Object.keys(LECTURES).map(Number).sort((a,b)=>a-b);
  return `<div class="home-scroll">
    <div style="padding:4px 0 8px;">
      <div style="font-size:13px;color:var(--muted);">강의를 선택하세요</div>
    </div>
    ${ids.map((id,i)=>{
      const lec = LECTURES[id];
      return `<div class="lecture-card" style="animation-delay:${i*0.05}s" onclick="openLecture(${id})">
        <span class="lecture-emoji">${lec.emoji}</span>
        <div class="lecture-info">
          <div class="lecture-num">${lec.id}강</div>
          <div class="lecture-title">${lec.title}</div>
          <div class="lecture-sub">${lec.subtitle}</div>
        </div>
        <span class="lecture-arrow">›</span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderLecture() {
  const lec = LECTURES[App.lectureId];
  const tabs = lec.chapters.map((c,i)=>
    `<button class="tab${App.chapterIdx===i?' on':''}" onclick="App.chapterIdx=${i};render()">
      ${c.emoji} ${c.title}
    </button>`
  ).join('');
  return `<div class="tabs">${tabs}</div>${lec.screens[App.chapterIdx]()}`;
}

/* 6. ACTIONS */
function openLecture(id) {
  App.screen='lecture'; App.lectureId=id; App.chapterIdx=0;
  render(); window.scrollTo(0,0);
}
function goHome() {
  App.screen='home'; App.lectureId=null; App.chapterIdx=0; render();
}

/* 7. BOOT - 강의 파일 로드 후 render */
TTS.init();
</script>

<script>
/* ── 강의 파일 자동 로드 ──────────────────────────────────
   새 강의 추가할 때 이 배열에 번호만 추가하세요!
   예: [1, 2, 3, 4, 5]
──────────────────────────────────────────────────────── */
const LECTURE_LIST = [1, 2, 3, 4, 5, 6];

(function loadLectures() {
  let i = 0;
  function loadNext() {
    if (i >= LECTURE_LIST.length) { render(); return; }
    const s = document.createElement('script');
    s.src = 'lecture' + LECTURE_LIST[i] + '.js';
    s.onload = () => { i++; loadNext(); };
    s.onerror = () => { console.warn('lecture' + LECTURE_LIST[i] + '.js 로드 실패'); i++; loadNext(); };
    document.body.appendChild(s);
  }
  loadNext();
})();
</script>

</body>
</html>
