<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🇻🇳">
<title>🇻🇳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0d0d1a;overscroll-behavior:none;-webkit-text-size-adjust:none;}
body{font-family:'Noto Sans KR',sans-serif;color:#f0e6ff;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#3d2c7a;border-radius:99px;}
:root{--bg:#0d0d1a;--surface:#1e1440;--border:#3d2c7a;--accent:#f7c948;--purple:#a259ff;--green:#4ade80;--red:#f87171;--muted:#a78bda;--dim:#6a4aaa;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100dvh;}
.header{padding:12px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.header-flag{font-size:28px;line-height:1;}
.streak{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--accent);}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:52px;padding:9px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;transition:color .15s;}
.tab.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:700;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;}
.btn-grad{width:100%;padding:16px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--purple),var(--accent));color:#0d0d1a;font-size:17px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-grad:disabled{background:var(--surface);color:var(--muted);}
.btn-ghost{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:8px;font-family:'Noto Sans KR',sans-serif;}
.prog-track{height:5px;background:var(--bg);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--accent));transition:width .4s;}
.badge{font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;}
.badge-err{font-size:11px;color:var(--red);background:#180606;border:1px solid #6e2a2a;border-radius:20px;padding:3px 10px;}
.flash-scene{perspective:800px;width:100%;height:220px;cursor:pointer;}
.flash-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.flash-inner.flipped{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:24px;}
.flash-front{background:linear-gradient(145deg,var(--surface),#16102e);border:1.5px solid var(--border);}
.flash-back{background:linear-gradient(145deg,#0d2b1e,#051810);border:1.5px solid #2a5e44;transform:rotateY(180deg);}
.input-area{flex-shrink:0;padding:10px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:8px;}
.answer-input{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--border);background:#0a081a;color:#f0e6ff;font-size:20px;text-align:center;outline:none;font-family:monospace;letter-spacing:1px;transition:border-color .2s;}
.answer-input:disabled{opacity:.7;}
.answer-input.ok{border-color:#2a6e44;color:var(--green);}
.answer-input.fail{border-color:#6e2a2a;color:var(--red);}
.answer-input.shaking{animation:shake .35s ease;}
.confirm-btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--purple),var(--accent));color:#0d0d1a;font-size:17px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.confirm-btn.next{background:var(--surface);color:var(--muted);}
.feedback{width:100%;padding:14px 16px;border-radius:18px;text-align:center;animation:popIn .22s ease;}
.feedback.ok{border:1.5px solid #2a6e44;background:#06180e;}
.feedback.fail{border:1.5px solid #6e2a2a;background:#180606;}
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100px;}
.bar-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bar-inner{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:90px;gap:1px;}
.bar-label{font-size:8px;color:var(--dim);transform:rotate(-30deg);margin-top:2px;white-space:nowrap;}
.bar-label.today{color:var(--accent);font-weight:700;}
.backup-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.backup-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:#f0e6ff;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.backup-ta{width:100%;height:70px;background:#0a081a;border:1.5px solid var(--border);border-radius:10px;color:#f0e6ff;font-size:11px;padding:8px;font-family:monospace;resize:none;outline:none;}
</style>
</head>
<body>
<div id="app"><div class="wrap" id="root"></div></div>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   1. WORD BANK
═══════════════════════════════════════════════════════════════ */
let WORDS = [];
let TOTAL = 0;

async function loadWords() {
  try {
    const res = await fetch('words.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('empty');
    WORDS = Object.freeze(data);
    TOTAL = WORDS.length;
  } catch (e) {
    console.error('words.json load failed:', e);
    App.loadError = true;
  }
}

/* ═══════════════════════════════════════════════════════════════
   2. SM-2
═══════════════════════════════════════════════════════════════ */
function sm2(card = {}, quality) {
  // quality: 0=Again, 3=Hard, 4=Good
  let { easiness = 2.5, interval = 0, reps = 0 } = card;
  if (quality >= 3) {
    if (reps === 0)      interval = 1;
    else if (reps === 1) interval = quality === 3 ? 2 : 3; // Hard: 2일, Good: 3일
    else if (quality === 3) interval = Math.max(1, Math.round(interval * 1.2)); // Hard: 소폭 증가
    else                    interval = Math.round(interval * easiness);          // Good: 정상 SM-2
    reps++;
  } else {
    interval = 1;
    reps = 0;
  }
  easiness = Math.max(1.3, easiness + 0.1 - (4 - quality) * (0.08 + (4 - quality) * 0.02));
  return { easiness: parseFloat(easiness.toFixed(2)), interval, reps, nextReview: Date.now() + interval * 864e5 };
}

/* ═══════════════════════════════════════════════════════════════
   3. STORAGE
═══════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'viet-v5';

const Store = {
  _data: { srs: {}, log: {}, seen: [] },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object') throw new Error('corrupted');
        this._data = { srs: p.srs || {}, log: p.log || {}, seen: p.seen || [] };
      }
    } catch (e) {
      console.warn('localStorage 손상, 초기화:', e);
      this._data = { srs: {}, log: {}, seen: [] };
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      App.storageWarning = true;
    }
    return this;
  },

  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this._data)); } catch (e) {}
    return this;
  },

  get srs()  { return this._data.srs; },
  get log()  { return this._data.log; },
  get seen() { return this._data.seen; },

  recordAnswer(vi, quality) {
    // quality: 0=Again, 3=Hard, 4=Good
    const prev = this._data.srs[vi] || {};
    const correct = quality >= 3;
    this._data.srs[vi] = {
      ...sm2(prev, quality),
      wrongCount: Math.max(0, (prev.wrongCount || 0) + (correct ? -1 : 1)),
      lastSeen: Date.now(),
    };
    const today = todayKey();
    const d = this._data.log[today] || { c: 0, w: 0 };
    this._data.log[today] = { c: d.c + (correct ? 1 : 0), w: d.w + (correct ? 0 : 1) };
    this.save();
  },

  reset() { this._data = { srs: {}, log: {}, seen: [] }; this.save(); },

  export() { return JSON.stringify({ version: 1, ...this._data }); },

  import(json) {
    const p = JSON.parse(json);
    if (!p.srs || typeof p.srs !== 'object' || Array.isArray(p.srs)) throw new Error('invalid srs');
    if (p.log && (typeof p.log !== 'object' || Array.isArray(p.log))) throw new Error('invalid log');
    if (p.seen && !Array.isArray(p.seen)) throw new Error('invalid seen');
    this._data = { srs: p.srs, log: p.log || {}, seen: p.seen || [] };
    this.save();
  },

  getDueWords() {
    const now = Date.now();
    const due = WORDS.filter(w => { const d = this.srs[w.vi]; return d && d.nextReview <= now; });
    const nw  = WORDS.filter(w => !this.srs[w.vi]);
    return [...due, ...nw];
  },

  // ── 플래시카드 전용: 틀린 단어 + 내일 복습 예정 우선 ──────────
  getFlashDeck() {
    const now = Date.now();
    const tomorrow = now + 864e5;

    // 1순위: 틀린 적 있는 단어 (wrongCount > 0)
    const wrong = WORDS.filter(w => {
      const d = this.srs[w.vi];
      return d && d.wrongCount > 0;
    }).sort((a, b) => (this.srs[b.vi].wrongCount || 0) - (this.srs[a.vi].wrongCount || 0));

    // 2순위: 내일 복습 예정 단어 (nextReview <= tomorrow)
    const upcoming = WORDS.filter(w => {
      const d = this.srs[w.vi];
      return d && d.nextReview > now && d.nextReview <= tomorrow && !(d.wrongCount > 0);
    });

    // 3순위: 아직 안 본 새 단어
    const unseen = WORDS.filter(w => !this.srs[w.vi]);

    // 전체 합치기
    const combined = [...wrong, ...upcoming, ...unseen];
    if (combined.length > 0) return combined;

    // 다 없으면 전체 랜덤
    return shuffle(WORDS);
  },

  get learned()  { return Object.keys(this.srs).length; },
  get mastered() { return Object.values(this.srs).filter(isMastered).length; },
};

/* ═══════════════════════════════════════════════════════════════
   4. TTS
═══════════════════════════════════════════════════════════════ */
const TTS = {
  init() {
    if (!window.speechSynthesis) return;
    const load = () => window.speechSynthesis.getVoices();
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
  },
  speak(text, rate = 0.85) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; u.rate = rate;
    const v = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('vi'));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  },
};

/* ═══════════════════════════════════════════════════════════════
   5. HELPERS
═══════════════════════════════════════════════════════════════ */
const norm     = s => s.toLowerCase().normalize('NFC').replace(/\s+/g, ' ').trim();
const MASTER_REPS     = 5;   // 마스터 최소 정답 횟수
const MASTER_INTERVAL = 21;  // 마스터 최소 복습 간격(일)
const isMastered = d => d.reps >= MASTER_REPS && d.interval >= MASTER_INTERVAL;
const todayKey = () => new Date().toISOString().slice(0, 10);
const shuffle  = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const esc      = s => s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#x27;','"':'&quot;'}[c]));

/* ═══════════════════════════════════════════════════════════════
   6. APP STATE
═══════════════════════════════════════════════════════════════ */
const App = {
  tab: 0,           // 0=flash 1=dictation 2=krvi 3=wrong 4=stats
  loadError: false,
  storageWarning: false,
  snapshot: null,   // ✏️ 오답 취소용 스냅샷
  screen: 'home',   // home | quiz | done
  mode: null,
  queue: [], qIdx: 0,
  phase: 'idle',    // idle | playing | correct | wrong
  input: '',
  streak: 0, sesC: 0, sesW: 0,
  pulsing: false, shaking: false,
  flashDeck: [], flashIdx: 0, flipped: false,
  chartDays: 14,
};

/* ═══════════════════════════════════════════════════════════════
   7. RENDERER
═══════════════════════════════════════════════════════════════ */
function render() {
  const root = document.getElementById('root');
  if (App.storageWarning) {
    App.storageWarning = false;
    alert('⚠️ 저장된 데이터가 손상되어 초기화했어요.\n백업이 있다면 복원해주세요.');
  }
  if (App.loadError) {
    root.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;">
      <div style="font-size:48px">⚠️</div>
      <div style="font-size:16px;color:var(--red);font-weight:700">단어장 로드 실패</div>
      <div style="font-size:13px;color:var(--muted)">words.json 파일을 불러올 수 없어요.</div>
      <button onclick="location.reload()" style="padding:12px 24px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--purple),var(--accent));color:#0d0d1a;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">🔄 새로고침</button>
    </div>`;
    return;
  }
  const isQuiz = App.screen === 'quiz';
  root.innerHTML = renderHeader() + (!isQuiz ? renderTabs() : '') + renderScreen();
  if (App.phase === 'playing') {
    const inp = document.getElementById('qi');
    if (inp) { inp.value = App.input; if (document.activeElement !== inp) inp.focus(); }
  }
}

function renderHeader() {
  if (App.screen === 'quiz') {
    return `<div class="header">
      <button onclick="goHome()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px 4px 0;line-height:1;">←</button>
      <div class="streak">🔥 ${App.streak}</div>
    </div>`;
  }
  return `<div class="header"><span class="header-flag">🇻🇳</span></div>`;
}

function renderTabs() {
  const labels = ['플래시카드', '받아쓰기', '🇰🇷→🇻🇳', '오답노트', '통계'];
  return `<div class="tabs">${labels.map((l, i) =>
    `<button class="tab${App.tab === i ? ' on' : ''}" onclick="setTab(${i})">${l}</button>`
  ).join('')}</div>`;
}

function renderScreen() {
  if (App.screen === 'quiz') return renderQuiz();
  if (App.screen === 'done') return renderDone();
  switch (App.tab) {
    case 0: return renderFlashHome();
    case 1: return renderQuizHome('dictation');
    case 2: return renderQuizHome('krvi');
    case 3: return renderWrongNote();
    case 4: return renderStats();
  }
}

/* ═══════════════════════════════════════════════════════════════
   8. SCREENS
═══════════════════════════════════════════════════════════════ */

/* ─── 플래시카드 ──────────────────────────────────────────── */
function renderFlashHome() {
  if (!App.flashDeck.length) App.flashDeck = Store.getFlashDeck();
  const deck = App.flashDeck;
  const idx  = Math.min(App.flashIdx, deck.length - 1);
  const word = deck[idx];

  // 덱 구성 정보
  const wrongCount    = deck.filter(w => Store.srs[w.vi]?.wrongCount > 0).length;
  const upcomingCount = deck.filter(w => {
    const d = Store.srs[w.vi];
    return d && d.nextReview > Date.now() && d.nextReview <= Date.now() + 864e5 && !d.wrongCount;
  }).length;
  const newCount = deck.filter(w => !Store.srs[w.vi]).length;

  return `<div style="flex:1;display:flex;flex-direction:column;padding:16px 18px;gap:14px;animation:fadeUp .3s ease;">

    <!-- 덱 구성 정보 -->
    <div class="card" style="padding:10px 14px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${wrongCount > 0 ? `<div style="font-size:11px;color:var(--red);background:#180606;border:1px solid #6e2a2a;border-radius:20px;padding:3px 10px;">❌ 오답 ${wrongCount}개</div>` : ''}
        ${upcomingCount > 0 ? `<div style="font-size:11px;color:var(--accent);background:#1a1000;border:1px solid #6e4a00;border-radius:20px;padding:3px 10px;">📅 내일복습 ${upcomingCount}개</div>` : ''}
        ${newCount > 0 ? `<div style="font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;">🆕 새단어 ${newCount}개</div>` : ''}
      </div>
    </div>

    <div class="flash-scene" onclick="flashFlip()">
      <div class="flash-inner${App.flipped ? ' flipped' : ''}">
        <div class="flash-face flash-front">
          <div style="font-size:11px;color:var(--muted);margin-bottom:12px;letter-spacing:1px">베트남어</div>
          <div style="font-family:'Boogaloo',cursive;font-size:52px;color:var(--accent);text-align:center">${esc(word.vi)}</div>
          <div style="font-size:13px;color:var(--dim);margin-top:10px">탭하여 뒤집기</div>
        </div>
        <div class="flash-face flash-back">
          <div style="font-size:11px;color:#4ade8080;margin-bottom:12px;letter-spacing:1px">한국어</div>
          <div style="font-size:22px;font-weight:700;color:var(--green);text-align:center">${esc(word.ko)}</div>
          <div style="font-size:14px;color:var(--muted);margin-top:8px;font-family:monospace">${esc(word.vi)}</div>
          <button onclick="event.stopPropagation();TTS.speak('${esc(word.vi)}')" style="margin-top:12px;padding:6px 16px;border-radius:20px;border:1px solid #2a6e44;background:transparent;color:var(--green);font-size:12px;cursor:pointer;">🔊 듣기</button>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;">
      <button onclick="flashPrev()" ${idx === 0 ? 'disabled' : ''} style="flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:${idx === 0 ? 'var(--dim)' : '#f0e6ff'};font-size:18px;cursor:pointer;">←</button>
      <button onclick="flashNext()" style="flex:2;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--purple),var(--accent));color:#0d0d1a;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        ${idx < deck.length - 1 ? '다음 →' : '완료 ✓'}
      </button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--dim)">${idx + 1} / ${deck.length}</div>
  </div>`;
}

/* ─── 퀴즈 홈 ────────────────────────────────────────────── */
function renderQuizHome(mode) {
  const due = Store.getDueWords().length;
  const label = mode === 'dictation' ? '받아쓰기' : '🇰🇷→🇻🇳';
  const desc  = mode === 'dictation' ? '소리 듣고 베트남어 입력' : '한국어 뜻 보고 베트남어 입력';

  return `<div style="flex:1;display:flex;flex-direction:column;padding:18px;gap:14px;animation:fadeUp .3s ease;">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      ${[
        { e:'📅', v:due,            c:due>0?'var(--accent)':'var(--green)', l:'복습 대기' },
        { e:'📖', v:Store.learned,  c:'var(--muted)',                       l:'학습 완료' },
        { e:'⭐', v:Store.mastered, c:'var(--accent)',                      l:'마스터' },
      ].map(s => `<div class="card" style="text-align:center;padding:12px 6px;">
        <div style="font-size:20px">${s.e}</div>
        <div style="font-size:20px;font-weight:700;color:${s.c};margin-top:3px">${s.v}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${s.l}</div>
      </div>`).join('')}
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;"><span>전체 진도</span><span>${Store.learned}/${TOTAL}</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${(Store.learned/TOTAL)*100}%"></div></div>
    </div>

    <div class="card" style="padding:12px 16px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">${label}</div>
      <div style="font-size:12px;color:var(--muted)">${desc}</div>
    </div>

    <button class="btn-grad" ${due===0?'disabled':''} onclick="startQuiz('${mode}')">
      ${due > 0 ? `시작 (${due}개) ▶` : '✅ 오늘 완료!'}
    </button>
  </div>`;
}

/* ─── 퀴즈 화면 ──────────────────────────────────────────── */
function renderQuiz() {
  if (App.phase === 'idle') return '';
  const word = App.queue[App.qIdx];
  if (!word) return '';

  const card  = Store.srs[word.vi] || {};
  const reps  = card.reps || 0;
  const wc    = card.wrongCount || 0;

  // ── 뱃지 로직 ──
  // 한 번이라도 출제된 적 있으면(srs에 기록 있으면) 복습 표시
  const hasRecord = !!Store.srs[word.vi];
  const bLabel = !hasRecord ? '🆕 새 단어'
               : isMastered(card) ? '⭐ 숙련'
               : `🔄 복습 ${reps}회`;
  const bColor = !hasRecord ? 'var(--muted)'
               : isMastered(card) ? 'var(--green)'
               : 'var(--accent)';

  const pct    = (App.qIdx / App.queue.length) * 100;
  const isDict = App.mode === 'dictation';

  return `
    <div style="padding:8px 20px 0;flex-shrink:0;">
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px;">
        <span>✅${App.sesC} ❌${App.sesW}</span><span>${App.qIdx+1}/${App.queue.length}</span>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px 8px;gap:14px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <div class="badge" style="color:${bColor}">${bLabel}</div>
        ${wc > 0 ? `<div class="badge-err">❌ ${wc}회</div>` : ''}
      </div>

      ${isDict ? `
        <button onclick="quizSpeak()" style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,${App.pulsing?'#2a1060,#1e1440':'#1e1440,#16102e'});border:3px solid ${App.pulsing?'var(--purple)':'var(--border)'};box-shadow:${App.pulsing?'0 0 28px #a259ff55':'0 4px 20px #00000050'};display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;outline:none;gap:4px;transform:${App.pulsing?'scale(1.05)':'scale(1)'};transition:all .2s;">
          <span style="font-size:42px">🔊</span>
          <span style="font-size:11px;color:var(--muted)">듣기</span>
        </button>
        <button onclick="TTS.speak('${esc(word.vi)}',0.5)" style="padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">🐢 천천히</button>
      ` : `
        <div class="card" style="width:100%;text-align:center;padding:24px 16px;">
          <div style="font-size:13px;color:var(--muted);margin-bottom:10px">베트남어로?</div>
          <div style="font-size:28px;font-weight:700;color:#f0e6ff;line-height:1.4">${esc(word.ko)}</div>
        </div>
      `}

      ${App.phase !== 'playing' ? `
      <div class="feedback ${App.phase === 'correct' ? 'ok' : 'fail'}">
        <div style="font-size:26px">${App.phase === 'correct' ? '✅' : '❌'}</div>
        <div style="font-size:15px;font-weight:700;margin-top:3px;color:${App.phase === 'correct' ? 'var(--green)' : 'var(--red)'}">
          ${App.phase === 'correct' ? '정답!' : '오답'}
        </div>
        <div style="font-size:22px;font-weight:700;color:#f0e6ff;margin-top:6px;font-family:monospace;letter-spacing:1px">${esc(word.vi)}</div>
        <div style="font-size:13px;color:#c4a8e8;margin-top:3px">${esc(word.ko)}</div>

        ${App.phase === 'wrong'   ? `<div style="font-size:12px;color:#f8717155;margin-top:6px">내 답: ${App.input}</div>` : ''}
      </div>` : ''}
    </div>

    <div class="input-area">
      <input id="qi"
        class="answer-input${App.phase==='correct'?' ok':App.phase==='wrong'?' fail':''}${App.shaking?' shaking':''}"
        placeholder="${isDict ? '철자 입력…' : '베트남어로 입력…'}"
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
        ${App.phase !== 'playing' ? 'disabled' : ''}
        oninput="App.input=this.value"
        onkeydown="if(event.key==='Enter')quizSubmit()"
      >
      ${App.phase === 'playing' ? `
        <button class="confirm-btn" onclick="quizSubmit()">확인 →</button>
      ` : App.phase === 'wrong' ? `
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;">
          <button onclick="quizRate(0)" style="padding:14px;border-radius:14px;border:none;background:#3a0a0a;color:var(--red);font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:1.5px solid #6e2a2a;">😓 Again — 다시 볼게요</button>
          <button onclick="retryInput()" style="padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-size:18px;cursor:pointer;">✏️</button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button onclick="quizRate(3)" style="padding:14px;border-radius:14px;border:none;background:#1a1200;color:var(--accent);font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:1.5px solid #6e5000;text-align:center;">

          </button>

            😊 Good${(() => { const c = Store.srs[App.queue[App.qIdx]?.vi]||{}; return (c.reps >= MASTER_REPS-1 && nextInterval(4) >= MASTER_INTERVAL) ? ' ⭐' : ''; })()}<br><span style="font-size:10px;color:#4ade8080;font-weight:400">${nextInterval(4)}일 후</span>
          </button>
        </div>
      `}
    </div>`;
}

/* ─── 오답노트 ───────────────────────────────────────────── */

/* ─── 통계 ───────────────────────────────────────────────── */
function renderStats() {
  const log  = Store.log;
  const allC = Object.values(log).reduce((a, d) => a + d.c, 0);
  const allW = Object.values(log).reduce((a, d) => a + d.w, 0);
  const allT = allC + allW;
  const studyDays = Object.values(log).filter(d => d.c + d.w > 0).length;
  const acc  = allT > 0 ? Math.round(allC / allT * 100) + '%' : '-';
  const n    = App.chartDays;
  const today = todayKey();

  const chartData = Array.from({ length: n }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (n - 1 - i));
    const key = d.toISOString().slice(0, 10);
    const entry = log[key] || { c: 0, w: 0 };
    return { key, label: `${d.getMonth()+1}/${d.getDate()}`, c: entry.c, w: entry.w, t: entry.c + entry.w };
  });
  const maxT = Math.max(...chartData.map(d => d.t), 1);
  const barW = Math.max(Math.floor(320 / n), 10);

  return `<div style="flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${[
        { e:'✅', v:allC,      c:'var(--green)',  l:'전체 정답' },
        { e:'❌', v:allW,      c:'var(--red)',    l:'전체 오답' },
        { e:'📅', v:studyDays, c:'var(--accent)', l:'학습일수'  },
        { e:'🎯', v:acc,       c:'var(--purple)', l:'정답률'    },
      ].map(s => `<div class="card" style="text-align:center;padding:12px;">
        <div style="font-size:18px">${s.e}</div>
        <div style="font-size:22px;font-weight:700;color:${s.c};margin-top:3px">${s.v}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${s.l}</div>
      </div>`).join('')}
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="font-size:12px;color:var(--muted);font-weight:700">최근 ${n}일</div>
        <div style="display:flex;gap:4px;">
          ${[7,14,30,60].map(d => `<button onclick="App.chartDays=${d};render()" style="padding:3px 8px;border-radius:10px;border:1px solid ${App.chartDays===d?'var(--accent)':'var(--border)'};background:${App.chartDays===d?'#f7c94820':'transparent'};color:${App.chartDays===d?'var(--accent)':'var(--dim)'};font-size:11px;cursor:pointer;">${d}일</button>`).join('')}
        </div>
      </div>
      <div class="chart-wrap">
        <div class="chart-bars" style="min-width:${barW*n}px;">
          ${chartData.map(d => {
            const th = (d.t / maxT) * 90;
            const ch = d.t > 0 ? (d.c / d.t) * th : 0;
            const wh = th - ch;
            const it = d.key === today;
            return `<div class="bar-col" style="width:${barW}px;">
              <div class="bar-inner">
                ${d.t > 0 ? `
                  <div style="width:100%;height:${ch}px;background:var(--green);border-radius:3px 3px 0 0;opacity:${it?1:.7}"></div>
                  ${wh > 0 ? `<div style="width:100%;height:${wh}px;background:var(--red);opacity:${it?1:.7}"></div>` : ''}
                ` : `<div style="width:100%;height:4px;background:#2a1a4a;border-radius:3px;margin-top:auto"></div>`}
              </div>
              <div class="bar-label${it?' today':''}">${d.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;justify-content:center;">
        <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><div style="width:8px;height:8px;background:var(--green);border-radius:2px"></div>정답</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><div style="width:8px;height:8px;background:var(--red);border-radius:2px"></div>오답</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:700">단어 레벨</div>
      ${[
        { l:'🆕 미학습', c:TOTAL - Store.learned,          col:'var(--border)' },
        { l:'🔄 학습중', c:Store.learned - Store.mastered, col:'var(--purple)' },
        { l:'⭐ 마스터', c:Store.mastered,                 col:'var(--green)' },
      ].map(s => `<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;"><span>${s.l}</span><span>${s.c}개</span></div>
        <div class="prog-track"><div style="height:100%;border-radius:99px;background:${s.col};width:${(s.c/TOTAL)*100}%;transition:width .6s"></div></div>
      </div>`).join('')}
    </div>

    <div class="backup-card">
      <div style="font-size:12px;color:var(--muted);font-weight:700">💾 백업</div>
      <div style="font-size:11px;color:var(--dim)">공부 후 가끔 백업해두세요!</div>
      <div style="display:flex;gap:8px;">
        <button class="backup-btn" onclick="doExport()">📤 백업 복사</button>
        <button class="backup-btn" onclick="doExportFile()">📁 파일 저장</button>
      </div>
    </div>

    <div class="backup-card">
      <div style="font-size:12px;color:var(--muted);font-weight:700">🔄 복원</div>
      <div style="display:flex;gap:8px;">
        <button class="backup-btn" onclick="toggleImport()">📥 백업 복원</button>
        <button class="backup-btn" onclick="doImportFile()">📂 파일 복원</button>
      </div>
      <div id="import-box" style="display:none;margin-top:4px;">
        <textarea class="backup-ta" id="import-ta" placeholder="백업 데이터 붙여넣기..."></textarea>
        <button class="backup-btn" style="width:100%;margin-top:6px" onclick="doImport()">복원 실행</button>
      </div>
    </div>

    <div class="backup-card" style="border-color:#6e2a2a;">
      <div style="font-size:12px;color:var(--red);font-weight:700">⚠️ 데이터 초기화</div>
      <div style="font-size:11px;color:var(--dim)">모든 학습 데이터가 삭제됩니다.</div>
      <button class="backup-btn" style="border-color:#6e2a2a;color:var(--red);" onclick="confirmReset()">🗑️ 초기화</button>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   9. ACTIONS
═══════════════════════════════════════════════════════════════ */
function setTab(i) { App.tab = i; App.screen = 'home'; render(); }
function goHome()  { App.screen = 'home'; render(); }

/* ── 플래시카드 ── */
function flashFlip() { App.flipped = !App.flipped; render(); }

function flashNext() {
  if (App.flashIdx < App.flashDeck.length - 1) {
    App.flashIdx++;
    App.flipped = false;
    render();
  } else {
    // 덱 완료 → 새 덱 빌드
    App.flashDeck = Store.getFlashDeck();
    App.flashIdx = 0;
    App.flipped = false;
    render();
  }
}

function flashPrev() {
  if (App.flashIdx > 0) { App.flashIdx--; App.flipped = false; render(); }
}

/* ── 퀴즈 ── */
function startQuiz(mode) {
  const due = Store.getDueWords();
  if (!due.length) { App.screen = 'done'; App.sesC = 0; App.sesW = 0; render(); return; }
  App.mode = mode; App.queue = shuffle(due); App.qIdx = 0;
  App.streak = 0; App.sesC = 0; App.sesW = 0;
  App.input = ''; App.phase = 'playing'; App.screen = 'quiz';
  render();
  if (mode === 'dictation') setTimeout(() => TTS.speak(App.queue[0].vi), 300);
  setTimeout(() => { const i = document.getElementById('qi'); if (i) i.focus(); }, 200);
}

function quizSpeak() {
  const word = App.queue[App.qIdx]; if (!word) return;
  App.pulsing = true; render();
  TTS.speak(word.vi);
  setTimeout(() => { App.pulsing = false; render(); }, 700);
}

function quizSubmit() {
  if (App.phase !== 'playing') return;
  if (!App.input.trim()) { if (App.mode === 'dictation') quizSpeak(); return; }
  const word    = App.queue[App.qIdx];
  const correct = norm(App.input) === norm(word.vi);
  if (correct) {
    App.phase = 'correct'; App.streak++; App.sesC++;
  } else {
    // 💡 오답 기록 전 스냅샷 촬영 (Deep Copy)
    const today = todayKey();
    App.snapshot = {
      srsWord:  Store._data.srs[word.vi] ? JSON.parse(JSON.stringify(Store._data.srs[word.vi])) : null,
      logToday: Store._data.log[today]   ? JSON.parse(JSON.stringify(Store._data.log[today]))   : null,
    };
    // 오답 기록 실행
    Store.recordAnswer(word.vi, 0);
    App.phase = 'wrong'; App.streak = 0; App.sesW++;
    App.shaking = true;
    setTimeout(() => { App.shaking = false; render(); }, 400);
    if (App.mode === 'dictation') setTimeout(() => TTS.speak(word.vi), 300);
  }
  render();
}

function retryInput() {
  const word = App.queue[App.qIdx];
  if (!word || !App.snapshot) return; // 스냅샷 없으면 무시 (중복 복구 방지)

  const today = todayKey();

  // 1. srs 단어 데이터 원상복구
  if (App.snapshot.srsWord === null) {
    delete Store._data.srs[word.vi]; // 새 단어였으면 레코드 삭제
  } else {
    Store._data.srs[word.vi] = App.snapshot.srsWord; // 기존 상태로 롤백
  }

  // 2. 일일 통계 로그 원상복구
  if (App.snapshot.logToday === null) {
    delete Store._data.log[today];
  } else {
    Store._data.log[today] = App.snapshot.logToday;
  }

  // 3. localStorage 저장
  Store.save();

  // 4. 세션 상태 롤백 + 입력창 초기화
  App.sesW       = Math.max(0, App.sesW - 1);
  App.phase      = 'playing';
  App.input      = '';
  App.snapshot   = null; // 스냅샷 비우기 (중복 복구 방지)

  render();
  setTimeout(() => { const i = document.getElementById('qi'); if (i) { i.value = ''; i.focus(); } }, 100);
}

function quizRate(quality) {
  // 정답 후 Hard/Good 선택 or 오답 후 Again
  const word = App.queue[App.qIdx];
  if (quality >= 3) Store.recordAnswer(word.vi, quality); // 오답은 이미 기록됨
  const next = App.qIdx + 1;
  if (next >= App.queue.length) {
    App.screen = 'done'; render();
  } else {
    App.qIdx = next; App.phase = 'playing'; App.input = ''; render();
    if (App.mode === 'dictation') setTimeout(() => TTS.speak(App.queue[next].vi), 150);
    setTimeout(() => { const i = document.getElementById('qi'); if (i) i.focus(); }, 100);
  }
}

function nextInterval(quality) {
  const word = App.queue[App.qIdx];
  if (!word) return 1;
  const card = Store.srs[word.vi] || {};
  const result = sm2(card, quality);
  return result.interval;
}

/* ── 백업 ── */
function doExport() {
  const json = Store.export();
  navigator.clipboard?.writeText(json)
    .then(() => alert('📋 복사됐어요! 메모장에 저장해두세요.'))
    .catch(() => prompt('복사하세요:', json));
}

function doExportFile() {
  const json = Store.export();
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `vocab-backup-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function doImportFile() {
  const input = document.createElement('input');
  input.type   = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        Store.import(ev.target.result.trim());
        alert('✅ 복원 완료! ' + Object.keys(Store.srs).length + '개');
        goHome();
      } catch (err) { alert('❌ 형식 오류'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function toggleImport() {
  const box = document.getElementById('import-box');
  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function doImport() {
  const ta = document.getElementById('import-ta');
  if (!ta?.value?.trim()) { alert('데이터를 입력해주세요.'); return; }
  try {
    Store.import(ta.value.trim());
    alert('✅ 복원 완료! ' + Object.keys(Store.srs).length + '개');
    goHome();
  } catch (e) { alert('❌ 형식 오류'); }
}

function confirmReset() {
  if (confirm('학습 데이터를 초기화할까요?')) { Store.reset(); render(); }
}

   10. BOOT
═══════════════════════════════════════════════════════════════ */
(async () => {
  await loadWords();
  Store.load();
  TTS.init();
  render();
})();
</script>
