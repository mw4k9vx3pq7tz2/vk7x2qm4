<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>⚡ 스피드런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#262624; --surface:#2f2f2c; --surface2:#34332f; --hairline:#3d3c38;
    --accent:#d97757; --accent-soft:rgba(217,119,87,.16); --accent-text:#1f1e1d;
    --text:#f5f4ef; --muted:#b8b5ad; --dim:#83827c;
    --green:#9db380; --green-bg:rgba(157,179,128,.16);
    --red:#e0635c; --red-bg:rgba(224,99,92,.14);
    --gold:#e6b765;
    --serif:'Lora',Georgia,serif; --sans:'Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .wrap{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;
    padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* ── 공통 ── */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;}
  .title{font-family:var(--serif);font-weight:700;font-size:40px;letter-spacing:-.01em;}
  .title .bolt{color:var(--accent);}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;max-width:300px;}
  .best{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hairline);
    padding:10px 18px;border-radius:99px;font-size:14px;}
  .best b{color:var(--gold);font-size:17px;font-weight:900;}
  .btn-primary{background:var(--accent);color:var(--accent-text);font-weight:700;font-size:18px;
    padding:16px 48px;border-radius:16px;box-shadow:0 6px 16px rgba(217,119,87,.28);}
  .btn-primary:active{transform:scale(.97);}
  .btn-ghost{background:var(--surface);border:1px solid var(--hairline);color:var(--text);
    font-weight:600;font-size:15px;padding:13px 28px;border-radius:14px;}
  .btn-ghost:active{transform:scale(.97);}

  /* ── 플레이 HUD ── */
  .hud{display:flex;align-items:center;justify-content:space-between;height:30px;flex-shrink:0;}
  .hearts{font-size:19px;letter-spacing:2px;}
  .heart-lost{opacity:.22;}
  .hud-best{font-size:12px;color:var(--dim);}
  .scorebar{flex-shrink:0;text-align:center;margin:10px 0 2px;}
  .score{font-family:var(--serif);font-weight:700;font-size:48px;line-height:1;transition:transform .12s;}
  .score.pop{transform:scale(1.14);}
  .combo{height:22px;font-size:14px;font-weight:700;color:var(--accent);margin-top:6px;
    opacity:0;transition:opacity .15s;}
  .combo.show{opacity:1;}
  .combo .mult{color:var(--gold);}

  .timer-track{height:8px;background:var(--surface);border-radius:99px;overflow:hidden;
    flex-shrink:0;margin:14px 0 0;}
  .timer-fill{height:100%;width:100%;background:var(--accent);border-radius:99px;}
  @keyframes drain{0%{width:100%;background:var(--accent)}65%{background:var(--accent)}100%{width:0%;background:var(--red)}}

  .prompt-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;}
  .prompt-label{font-size:12px;color:var(--dim);letter-spacing:.04em;}
  .prompt{font-size:34px;font-weight:700;line-height:1.25;padding:0 6px;}

  .options{display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
  .opt{font-family:var(--serif);font-size:23px;font-weight:600;padding:17px 16px;border-radius:14px;
    background:var(--surface);border:1.5px solid var(--hairline);transition:transform .1s,background .15s,border-color .15s;
    min-height:60px;display:flex;align-items:center;justify-content:center;}
  .opt:active{transform:scale(.985);}
  .opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .opt.dim{opacity:.4;}

  /* ── 게임오버 ── */
  .newbest{background:var(--gold);color:#1f1e1d;font-weight:900;font-size:13px;
    padding:5px 16px;border-radius:99px;letter-spacing:.04em;animation:pulse 1s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .final{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1;color:var(--accent);}
  .stat-row{display:flex;gap:26px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .v{font-family:var(--serif);font-weight:700;font-size:26px;}
  .stat .l{font-size:11px;color:var(--dim);}
  .shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="wrap" id="root"></div></div>

<script>
'use strict';
/* ════════ 스피드런 — 독립 프로토타입 ════════
   • 학습 데이터(viet-words-v1 / viet-v5)는 읽기 전용. 절대 쓰지 않음.
   • 최고기록만 별도 키(SCORE_KEY)에 저장.
   ────────────────────────────────────────── */
const WORDS_KEY = 'viet-words-v1';   // 읽기 전용
const SRS_KEY   = 'viet-v5';         // 읽기 전용 (wrongCount만 참고)
const SCORE_KEY = 'viet-speedrun-hi';// 쓰기 (게임 점수 전용)

// ── 튜닝 노브 (손맛 조정용) ──
const START_HEARTS = 3;
const BASE_TIME    = 6.0;   // 첫 문제 제한시간(초)
const MIN_TIME     = 3.0;   // 최소 제한시간(초)
const RAMP_Q       = 25;    // 이 문제 수에서 난이도 최대
const BASE_POINTS  = 10;
const MULT_CAP     = 4;     // 콤보 배수 상한
const WRONG_WEIGHT = 3;     // wrongCount 가중 강도
const REVEAL_MS    = 750;   // 정/오답 보여주는 시간

// ── 헬퍼 ──
const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const shuffle = a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]];} return r; };
const WORD_BAD_VI = /['"`\\<>]/;
function sanitize(arr){
  const seen=new Set(); const out=[];
  for(const w of arr){
    if(!w||typeof w.vi!=='string'||typeof w.ko!=='string')continue;
    if(!w.vi.trim()||!w.ko.trim()||WORD_BAD_VI.test(w.vi))continue;
    if(seen.has(w.vi))continue; seen.add(w.vi); out.push({vi:w.vi,ko:w.ko});
  }
  return out;
}
// 임베드 폴백 (네 데이터가 없을 때도 돌아가게)
const SAMPLE = [
  ['phở','쌀국수'],['bạn','친구'],['xin chào','안녕하세요'],['cảm ơn','감사합니다'],['ăn','먹다'],
  ['uống','마시다'],['nước','물'],['cơm','밥'],['nhà','집'],['người','사람'],['yêu','사랑하다'],
  ['đi','가다'],['đến','오다'],['học','공부하다'],['làm','하다, 일하다'],['nói','말하다'],['nghe','듣다'],
  ['xem','보다'],['đọc','읽다'],['viết','쓰다'],['ngủ','자다'],['mua','사다'],['bán','팔다'],['tiền','돈'],
  ['chợ','시장'],['trường','학교'],['sách','책'],['bút','펜'],['bàn','책상'],['ghế','의자'],['cửa','문'],
  ['đường','길'],['xe','차'],['trời','하늘'],['mưa','비'],['nắng','햇빛'],['gió','바람'],['hoa','꽃'],
  ['cây','나무'],['chó','개'],['mèo','고양이'],['gà','닭'],['cá','물고기'],['thịt','고기'],['rau','채소'],
  ['ngon','맛있다'],['đẹp','예쁘다'],['tốt','좋다'],['xấu','나쁘다'],['lớn','크다'],['nhỏ','작다'],
  ['nhanh','빠르다'],['chậm','느리다'],['nóng','덥다'],['lạnh','춥다'],['vui','기쁘다'],['buồn','슬프다'],
  ['mới','새롭다'],['cũ','오래된'],['một','하나'],['hai','둘'],['ba','셋'],['bốn','넷'],['năm','다섯'],
].map(([vi,ko])=>({vi,ko}));

function loadWords(){
  try{ const raw=localStorage.getItem(WORDS_KEY);
    if(raw){ const w=sanitize(JSON.parse(raw)); if(w.length>=8) return w; } }catch(e){}
  return SAMPLE;
}
function loadWrong(){
  try{ const raw=localStorage.getItem(SRS_KEY);
    if(raw){ const d=JSON.parse(raw); return (d&&d.srs)||{}; } }catch(e){}
  return {};
}
function loadBest(){
  try{ const raw=localStorage.getItem(SCORE_KEY); if(raw){ const b=JSON.parse(raw);
    return {best:b.best|0, combo:b.combo|0}; } }catch(e){}
  return {best:0, combo:0};
}
function saveBest(score, combo){
  try{ const cur=loadBest();
    localStorage.setItem(SCORE_KEY, JSON.stringify({
      best:Math.max(cur.best,score), combo:Math.max(cur.combo,combo) })); }catch(e){}
}

const WORDS = loadWords();
const SRS   = loadWrong();
const wrongOf = vi => { const r=SRS[vi]; return (r&&r.wrongCount>0)?r.wrongCount:0; };

// ── 게임 상태 ──
const G = {
  screen:'start', hearts:START_HEARTS, score:0, combo:0, maxCombo:0,
  qCount:0, cur:null, locked:false, timer:null, best:loadBest(),
  recent:[], // 최근 출제 vi (즉시 반복 방지)
};

// 난이도 0→1
const diffT = () => Math.min(1, G.qCount / RAMP_Q);
const comboMult = () => Math.min(MULT_CAP, 1 + Math.floor(G.combo/5)*0.5);
const timeLimit = () => BASE_TIME - (BASE_TIME-MIN_TIME)*diffT();

// 가중 추출: 콤보(난이도) 오를수록 wrongCount 큰 단어 비중↑
function pickWord(){
  const t = diffT();
  const pool = WORDS.filter(w => !G.recent.includes(w.vi));
  const src = pool.length>=4 ? pool : WORDS;
  let total=0; const weights=src.map(w=>{ const wt=1 + wrongOf(w.vi)*WRONG_WEIGHT*t; total+=wt; return wt; });
  let r=Math.random()*total;
  let idx=0; for(;idx<src.length;idx++){ r-=weights[idx]; if(r<=0)break; }
  const word = src[Math.min(idx,src.length-1)];
  G.recent.push(word.vi); if(G.recent.length>8) G.recent.shift();
  return word;
}

// 보기 4개 (난이도 오를수록 헷갈리는 오답)
function makeOptions(word){
  const t = diffT();
  const others = WORDS.filter(w => w.vi!==word.vi && w.ko!==word.ko);
  const score = w => {
    let s=0;
    if(fold(w.vi)[0]===fold(word.vi)[0]) s+=2;
    if(Math.abs(w.vi.length-word.vi.length)<=1) s+=1;
    const fa=fold(w.vi), fb=fold(word.vi);
    let shared=0; for(const c of new Set(fa)) if(fb.includes(c)) shared++;
    s += shared*0.3;
    return s;
  };
  let pool;
  if(Math.random() < t && others.length>12){
    pool = [...others].sort((a,b)=>score(b)-score(a)).slice(0, 14);
  } else {
    pool = others;
  }
  const distractors = shuffle(pool).slice(0,3);
  // pool이 모자라면 전체에서 보충
  while(distractors.length<3){
    const cand = WORDS[Math.random()*WORDS.length|0];
    if(cand.vi!==word.vi && !distractors.some(d=>d.vi===cand.vi)) distractors.push(cand);
  }
  const options = shuffle([word, ...distractors]);
  return { options, correctVi: word.vi };
}

// ── 흐름 ──
function startGame(){
  G.hearts=START_HEARTS; G.score=0; G.combo=0; G.maxCombo=0; G.qCount=0;
  G.locked=false; G.recent=[]; G.screen='play';
  nextQuestion();
}
function nextQuestion(){
  clearTimer();
  G.locked=false;
  const word = pickWord();
  G.cur = { word, ...makeOptions(word) };
  G.qCount++;
  renderPlay();
  startTimer();
}
function startTimer(){
  const lim = timeLimit();
  const fill = document.getElementById('tfill');
  if(fill){
    fill.style.animation='none';
    void fill.offsetWidth;                          // 리플로우로 리셋
    fill.style.animation=`drain ${lim}s linear forwards`;
  }
  G.timer = setTimeout(()=>answer(null), lim*1000);
}
function clearTimer(){ if(G.timer){ clearTimeout(G.timer); G.timer=null; } }

function answer(vi){
  if(G.locked) return;
  G.locked=true; clearTimer();
  const correct = vi!==null && vi===G.cur.correctVi;
  // 타이머 현재 위치에서 정지
  const fill=document.getElementById('tfill');
  if(fill) fill.style.animationPlayState='paused';

  // 보기 색칠
  document.querySelectorAll('.opt').forEach(btn=>{
    const bvi=btn.dataset.vi;
    if(bvi===G.cur.correctVi) btn.classList.add('correct');
    else if(bvi===vi) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if(correct){
    G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);
    const gained = Math.round(BASE_POINTS*comboMult());
    G.score += gained;
    const sc=document.getElementById('score'); if(sc){ sc.textContent=G.score; sc.classList.add('pop'); setTimeout(()=>sc.classList.remove('pop'),130); }
    updateCombo();
  } else {
    G.combo=0; G.hearts--;
    const hud=document.getElementById('hud'); if(hud) hud.classList.add('shake');
    renderHearts();
    updateCombo();
  }

  setTimeout(()=>{
    if(G.hearts<=0){ gameOver(); }
    else nextQuestion();
  }, REVEAL_MS);
}

function gameOver(){
  clearTimer(); G.screen='over';
  const prevBest = G.best.best;
  const isNew = G.score>prevBest;
  saveBest(G.score, G.maxCombo);
  G.best = loadBest();
  renderOver(isNew, prevBest);
}

// ── 렌더 ──
const root = document.getElementById('root');
function render(){
  if(G.screen==='start') renderStart();
  else if(G.screen==='play') renderPlay();
  else renderOver(false,0);
}
function renderStart(){
  root.innerHTML = `
    <div class="center fade">
      <div class="title"><span class="bolt">⚡</span> 스피드런</div>
      <div class="best">🏆 최고 <b>${G.best.best}</b>점 · 최대콤보 ${G.best.combo}</div>
      <div class="sub">한국어 뜻을 보고 맞는 베트남어를 탭!<br>하트 ${START_HEARTS}개 · 틀리거나 시간초과 시 하트 감소.<br>콤보가 쌓일수록 점수 배수↑, 그리고 <b style="color:var(--accent)">갈수록 매워진다</b> 🌶️</div>
      <button class="btn-primary" onclick="startGame()">시작</button>
    </div>`;
}
function renderHearts(){
  const el=document.getElementById('hearts');
  if(el){ let h=''; for(let i=0;i<START_HEARTS;i++) h+=`<span class="${i<G.hearts?'':'heart-lost'}">❤️</span>`; el.innerHTML=h; }
}
function updateCombo(){
  const el=document.getElementById('combo');
  if(!el) return;
  if(G.combo>=2){ el.innerHTML=`🔥 ${G.combo} 콤보 <span class="mult">×${comboMult().toFixed(1)}</span>`; el.classList.add('show'); }
  else { el.classList.remove('show'); }
}
function renderPlay(){
  let hearts=''; for(let i=0;i<START_HEARTS;i++) hearts+=`<span class="${i<G.hearts?'':'heart-lost'}">❤️</span>`;
  const opts = G.cur.options.map(w=>
    `<button class="opt" data-vi="${w.vi}" onclick="answer('${w.vi.replace(/'/g,"\\'")}')">${w.vi}</button>`
  ).join('');
  root.innerHTML = `
    <div class="hud" id="hud">
      <div class="hearts" id="hearts">${hearts}</div>
      <div class="hud-best">🏆 ${G.best.best}</div>
    </div>
    <div class="scorebar">
      <div class="score" id="score">${G.score}</div>
      <div class="combo ${G.combo>=2?'show':''}" id="combo">${G.combo>=2?`🔥 ${G.combo} 콤보 <span class="mult">×${comboMult().toFixed(1)}</span>`:''}</div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="tfill"></div></div>
    <div class="prompt-zone">
      <div class="prompt-label">이 뜻의 베트남어는?</div>
      <div class="prompt">${G.cur.word.ko}</div>
    </div>
    <div class="options">${opts}</div>`;
}
function renderOver(isNew, prevBest){
  root.innerHTML = `
    <div class="center fade">
      ${isNew?'<div class="newbest">🎉 NEW BEST!</div>':''}
      <div style="font-family:var(--serif);font-weight:700;font-size:22px;color:var(--muted)">끝!</div>
      <div class="final">${G.score}</div>
      <div class="stat-row">
        <div class="stat"><div class="v">${G.maxCombo}</div><div class="l">최대 콤보</div></div>
        <div class="stat"><div class="v" style="color:var(--gold)">${G.best.best}</div><div class="l">역대 최고</div></div>
      </div>
      ${!isNew && prevBest>0 ? `<div class="sub">최고기록까지 ${prevBest-G.score}점 남았어!</div>`:''}
      <div style="display:flex;gap:12px;margin-top:4px">
        <button class="btn-primary" onclick="startGame()">한 번 더</button>
        <button class="btn-ghost" onclick="G.screen='start';render()">그만</button>
      </div>
    </div>`;
}

// 전역 노출 (onclick용)
window.startGame=startGame; window.answer=answer; window.render=render; window.G=G;
window.renderStart=renderStart; window.renderPlay=renderPlay; window.renderOver=renderOver;

document.fonts && document.fonts.ready.then(()=>{});
render();
</script>
</body>
</html>
